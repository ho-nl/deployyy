name: cli

on:
  pull_request:
    paths: [cli/**, install.sh, .github/workflows/cli.yml]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck ../install.sh
      - name: Build
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/deployyy-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum deployyy-* > SHA256SUMS
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "deployyy $GITHUB_REF_NAME" --generate-notes

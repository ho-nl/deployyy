# Central GraphCommerce build — reusable workflow.
#
# A GraphCommerce storefront is a Next.js app, and the platform builds it with
# the same recipe (recipes/nextjs) and the same workflow as any Next.js app;
# see nextjs-build.yml for the full contract. This file exists so a
# GraphCommerce project can name what it is:
#
#   jobs:
#     build:
#       uses: ho-nl/deployyy/.github/workflows/graphcommerce-build.yml@main
#       secrets: inherit
#
# GraphCommerce-specific build input goes in repository variables or secrets
# named GC_* (for example GC_MAGENTO_ENDPOINT when graphcommerce.config.js
# does not set it); nextjs-build passes those to `next build`. Secrets need
# `secrets: inherit`, which only works for a caller inside ho-nl: from another
# organization use repository variables (see nextjs-build.yml).

name: graphcommerce-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubicloud-standard-8
        description: Runner label

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ho-nl/deployyy/.github/workflows/nextjs-build.yml@main
    with:
      runs-on: ${{ inputs.runs-on }}
    secrets: inherit

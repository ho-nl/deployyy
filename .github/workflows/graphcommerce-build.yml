# Central GraphCommerce build — reusable workflow.
#
# A GraphCommerce storefront is a Next.js app, and the platform builds it with
# the same recipe (recipes/nextjs) and the same workflow as any Next.js app;
# see nextjs-build.yml for the full contract. This file exists so a
# GraphCommerce project can name what it is, with the same hand-off as every
# other project — all of its variables and secrets, never named:
#
#   jobs:
#     build:
#       uses: ho-nl/deployyy/.github/workflows/graphcommerce-build.yml@main
#       permissions:
#         contents: read
#         packages: write
#         actions: read
#         id-token: write
#       with:
#         vars: ${{ toJSON(vars) }}
#       secrets:
#         all: ${{ toJSON(secrets) }}
#
# Build input is a repository variable or secret like any other; it reaches
# `next build` and, after the build, the running storefront. The one exception
# is GC_MAGENTO_ENDPOINT on a Deployyy project with a paired Magento backend:
# the platform publishes each branch's backend in DEPLOYYY_GC_MAGENTO_ENDPOINTS,
# and nextjs-build.yml builds the branch against it (see there).

name: graphcommerce-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubicloud-standard-8
        description: Runner label
      vars:
        type: string
        default: "{}"
        description: "The caller's variables, all of them: toJSON(vars)"
    secrets:
      all:
        required: false
        description: "The caller's secrets, all of them: toJSON(secrets)"

jobs:
  build:
    # No permissions here: nextjs-build.yml takes the caller's grants (see
    # magento2-build.yml), so a caller that grants less still starts.
    uses: ho-nl/deployyy/.github/workflows/nextjs-build.yml@main
    with:
      runs-on: ${{ inputs.runs-on }}
      platform: graphcommerce
      # A caller still on `secrets: inherit` (inside ho-nl) has no `all`:
      # hand on what it inherited instead.
      vars: ${{ inputs.vars != '{}' && inputs.vars || toJSON(vars) }}
    secrets:
      all: ${{ secrets.all || toJSON(secrets) }}

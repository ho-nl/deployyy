# Central Laravel build — reusable workflow for deployyy LaravelApp projects.
#
# A project repo calls this with a few lines (see README); everything else is
# derived:
#   - PHP: the project's choice when it made one (the repository Actions
#     variable DEPLOYYY_PHP, set by the deployyy operator:
#     {"default":"8.3","branches":{"staging":"8.4"}}, the branch's entry
#     first), else composer.json `require.php` (the highest supported minor
#     the constraint names: 8.4, 8.3 or 8.2; absent → 8.4). A chosen version
#     is in the tags — php-fpm-<php>-<sha7> + nginx-<php>-<sha7> — the only
#     ones the operator accepts for a project that chose it.
#   - The DOCKERFILE is recipes/laravel — unless the repo ships its own
#     (a repo-local Dockerfile wins wholesale). .platform/* support files are
#     overlaid per file (a repo-local copy of one file keeps the others).
#   - Images push to ghcr.io/<caller repo> as php-fpm-<sha7> + nginx-<sha7>,
#     the commit-keyed tags the operator verifies before a release. Both are
#     pushed by digest, scanned (trivy: a fixable CRITICAL fails the build
#     when the caller sets DEPLOYYY_SCAN_ENFORCE=1, else it is reported)
#     and tagged only when both passed, with SBOM + provenance attestations
#     (.github/actions/build-scan).
#
#   - SEVERAL APPLICATIONS in one repository, each in its own folder and each
#     a project of its own: the operator sets DEPLOYYY_APPS (an entry per
#     folder with its image and settings) in place of the single variables
#     above, and this workflow builds the entries of its kind, one job each,
#     re-using the release of an application whose folder the push did not
#     change (actions/applications, README "Several applications in one
#     repository"). Without DEPLOYYY_APPS it is one job, `build`, as always.
#
# Variables and secrets: ALL of the project's, never named — the same hand-off
# and the same handling as magento2-build.yml (see its header):
#
#   with:
#     vars: ${{ toJSON(vars) }}
#   secrets:
#     all: ${{ toJSON(secrets) }}
#
# A GitHub Environment named after the branch overrides the repository's
# values. COMPOSER_AUTH, when the project has it, becomes auth.json; public
# packages need none. After a successful build the set goes to Deployyy for
# this branch's environment (deliver-values, OIDC, never fails the build).
#
# Permissions: the jobs declare none and take the caller's grants, as
# magento2-build.yml explains, so a caller from before 2026-10-07 still builds
# and is told what to change.

# The application may live in a subfolder: the repository Actions variable
# DEPLOYYY_ROOT_DIR (set by the deployyy operator) names it, and every file the
# build reads, and the docker build context, are taken from there. Unset: the
# repository root. See magento2-build.yml.

name: laravel-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubicloud-standard-8
        description: Runner label
      vars:
        type: string
        default: "{}"
        description: "All caller variables, as toJSON(vars)"
    secrets:
      all:
        required: false
        description: "All caller secrets, as toJSON(secrets)"
      # The previous hand-off named this one. Still declared so such a caller
      # starts; project-values merges it in and warns to pass `all` instead.
      COMPOSER_AUTH:
        required: false
        description: "Deprecated: pass all instead"

jobs:
  # Which GitHub Environment the build runs in: the one named after the branch,
  # when the repository has it. Looked up rather than assumed, because a job
  # that names an Environment that does not exist creates it — one per preview
  # branch, for nothing.
  environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.find.outputs.name }}
      # Which of the repository's applications this run builds and which it
      # re-uses (actions/applications): one `build` for a repository with one
      # application, as always.
      build: ${{ steps.apps.outputs.build }}
      reuse: ${{ steps.apps.outputs.reuse }}
    steps:
      - name: Find the branch's GitHub Environment
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "\"$BRANCH\" is a tag. The repository's variables and secrets apply."; exit 0
          fi
          enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$BRANCH")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPO/environments/$enc" || echo 000)
          case "$code" in
            200) echo "GitHub Environment \"$BRANCH\" found. Its variables and secrets override the repository's."
                 echo "name=$BRANCH" >> "$GITHUB_OUTPUT" ;;
            404) echo "No GitHub Environment \"$BRANCH\". The repository's variables and secrets apply." ;;
            403) echo "::warning title=Missing permission actions: read::The caller workflow does not grant \`actions: read\`. Values from GitHub Environment \"$BRANCH\" are not used. Add \`actions: read\` to the caller's \`permissions\`, see README Step 3." ;;
            *)   echo "::warning::GitHub Environment lookup for \"$BRANCH\" failed with HTTP $code. The repository's variables and secrets apply. Re-run the build to use the Environment's values." ;;
          esac

      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      # A repository may hold several applications, each a project of its own
      # (DEPLOYYY_APPS, set by the deployyy operator): one build job per
      # laravel application, and none for one whose folder this push did
      # not change (its release is re-used, the reuse job below).
      - name: Plan applications
        id: apps
        uses: ./.platform-recipes/.github/actions/applications
        with:
          vars: ${{ inputs.vars }}
          application: laravel

  build:
    needs: environment
    if: needs.environment.outputs.build != '[]'
    # `build` for a repository with one application, so its check keeps its
    # name; `build (<folder>)` per application otherwise.
    name: Build
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.build) }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch platform build recipes
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: |
            recipes
            .github/actions

      - name: Load variables and secrets
        id: values
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}

      # This job's application: for a repository with several, its folder,
      # image and settings stand in for the repository's single variables.
      - name: Set up application
        id: app
        uses: ./.platform-recipes/.github/actions/application
        with:
          app: ${{ toJSON(matrix.app) }}

      - name: Check application directory
        id: root
        # DEPLOYYY_ROOT_DIR (set by the deployyy operator from the project's
        # root directory) is in the environment with the project's variables.
        # Unset or empty: the repository root, as before it existed.
        run: |
          dir="${DEPLOYYY_ROOT_DIR:-}"
          if [ -z "$dir" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail() { echo "::error title=DEPLOYYY_ROOT_DIR::$1"; exit 1; }
          [[ "$dir" =~ ^[A-Za-z0-9_.@+/-]+$ ]] ||
            fail "DEPLOYYY_ROOT_DIR contains characters other than letters, digits and / _ . @ + -. Set the project's root directory to a path inside the repository, such as src."
          case "$dir" in
            /*) fail "DEPLOYYY_ROOT_DIR=$dir starts with /. Set the project's root directory to a path inside the repository, such as src." ;;
            */ | *//*) fail "DEPLOYYY_ROOT_DIR=$dir has an empty segment. Set the project's root directory to a path inside the repository, such as src." ;;
          esac
          IFS=/ read -ra parts <<< "$dir"
          path=""
          for part in "${parts[@]}"; do
            case "$part" in
              . | ..) fail "DEPLOYYY_ROOT_DIR=$dir has a . or .. segment. Set the project's root directory to a path inside the repository, such as src." ;;
            esac
            path="${path:+$path/}$part"
            [ -L "$path" ] && fail "DEPLOYYY_ROOT_DIR=$dir: $path is a symbolic link. Set the project's root directory to the real directory."
            [ -d "$path" ] || fail "DEPLOYYY_ROOT_DIR=$dir: directory $path does not exist in commit ${GITHUB_SHA::7}. Push the directory or change the project's root directory."
          done
          echo "Application directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Resolve PHP and build context
        id: resolve
        # DEPLOYYY_PHP (the platform's setting) is in the environment already.
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          BRANCH: ${{ github.ref_name }}
          RECIPES: ${{ github.workspace }}/.platform-recipes/recipes
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib, re, shutil, sys

          req = json.load(open("composer.json")).get("require", {})
          constraint = req.get("php", "")
          supported = ["8.4", "8.3", "8.2"]
          named = set(re.findall(r"8\.\d+", constraint))
          php = next((v for v in supported if v in named), None)
          if php is None:
              # `^8.1`/`>=8.0` and friends admit every supported line: take
              # the newest. A constraint that names only unsupported lines
              # still builds on the newest, and composer says if it cannot.
              php = supported[0]
          print(f"composer.json requires php {constraint!r}. PHP {php} selected.")

          # The project's PHP choice (set by the deployyy operator) wins.
          chosen = ""
          raw = os.environ.get("DEPLOYYY_PHP", "").strip()
          if raw:
              try:
                  choice = json.loads(raw)
              except ValueError:
                  sys.exit(f"FATAL: the repository variable DEPLOYYY_PHP is not valid JSON: {raw!r}. Choose the PHP version again in the console.")
              chosen = (choice.get("branches") or {}).get(os.environ["BRANCH"]) or choice.get("default") or ""
          if chosen:
              if chosen not in supported:
                  sys.exit(f"FATAL: PHP {chosen} is not available for Laravel. Choose PHP {', '.join(supported)} in the console.")
              php = chosen
              print(f"PHP {php}, chosen in the console")

          recipe = pathlib.Path(os.environ["RECIPES"]) / "laravel"
          if pathlib.Path("Dockerfile").exists():
              print("Dockerfile: the repository's own. The recipe Dockerfile is not used.")
          else:
              shutil.copy(recipe / "Dockerfile", "Dockerfile")
              print("Dockerfile: recipes/laravel")
          pathlib.Path(".platform").mkdir(exist_ok=True)
          for f in sorted((recipe / "platform").iterdir()):
              dest = pathlib.Path(".platform") / f.name
              if dest.exists():
                  print(f".platform/{f.name}: the repository's own")
              else:
                  shutil.copy(f, dest)
                  print(f".platform/{f.name}: from the recipe")

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          print(f"php={php}", file=out)
          sha7 = os.environ['GITHUB_SHA'][:7]
          print(f"sha_tag={chosen + '-' + sha7 if chosen else sha7}", file=out)
          print(f"os_updates_day={datetime.date.today().isoformat()}", file=out)
          EOF

      - name: Write auth.json
        # COMPOSER_AUTH is one of the project's secrets, exported by
        # project-values like every other key.
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -n "${COMPOSER_AUTH:-}" ]; then printf '%s' "$COMPOSER_AUTH" > auth.json
          else echo '{}' > auth.json; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + scan php-fpm
        id: php
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: php-fpm
          label: php-fpm
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          build-args: PHP_VERSION=${{ steps.resolve.outputs.php }}
          secret-files: build-env=${{ steps.values.outputs.build-env }}
          cache-from: type=gha,scope=php-fpm${{ steps.app.outputs.scope }}
          cache-to: type=gha,scope=php-fpm${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      - name: Build + scan nginx
        id: nginx
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: nginx
          label: nginx
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          secret-files: build-env=${{ steps.values.outputs.build-env }}
          build-args: |
            PHP_VERSION=${{ steps.resolve.outputs.php }}
            PLATFORM_OS_UPDATES_DAY=${{ steps.resolve.outputs.os_updates_day }}
          cache-from: |
            type=gha,scope=nginx${{ steps.app.outputs.scope }}
            type=gha,scope=php-fpm${{ steps.app.outputs.scope }}
          cache-to: type=gha,scope=nginx${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      - name: Tag the release
        env:
          IMAGE: ${{ steps.app.outputs.image }}
          SHA_TAG: ${{ steps.resolve.outputs.sha_tag }}
          PHP_REF: ${{ steps.php.outputs.ref }}
          NGINX_REF: ${{ steps.nginx.outputs.ref }}
        run: |
          image="${IMAGE,,}"
          docker buildx imagetools create -t "$image:nginx-$SHA_TAG" "$NGINX_REF"
          docker buildx imagetools create -t "$image:php-fpm-$SHA_TAG" "$PHP_REF"
          echo "Released $image:php-fpm-$SHA_TAG and $image:nginx-$SHA_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      # The same variables and secrets, for the running app: Deployyy writes
      # them into this branch's environment. Never fails the build.
      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.values.outputs.values }}
          platform: laravel
          several: ${{ steps.app.outputs.multi }}
          root-directory: ${{ steps.app.outputs.directory }}

  # An application whose folder this push did not change: its new commit's
  # tags point at the release of the push before, which is the image a build
  # would make again (the folder is the whole build context). Only for a
  # repository with several applications (actions/applications says when).
  reuse:
    needs: environment
    if: needs.environment.outputs.reuse != '[]'
    name: Reuse unchanged release
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.reuse) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      - name: Load variables and secrets
        id: values
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}
          export: "false"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the previous push's release
        env:
          IMAGE: ${{ matrix.app.image }}
          PAIRS: ${{ toJSON(matrix.app.pairs) }}
          FROM: ${{ matrix.app.from }}
          DIRECTORY: ${{ matrix.app.directory }}
        run: |
          image="${IMAGE,,}"
          python3 -c 'import json, os; [print(a, b) for a, b in json.loads(os.environ["PAIRS"])]' |
          while read -r old new; do
            docker buildx imagetools create -t "$image:$new" "$image:$old"
          done
          echo "$DIRECTORY is unchanged since $FROM. Released $image with the $FROM release." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.values.outputs.values }}
          platform: laravel
          several: "true"
          root-directory: ${{ matrix.app.directory }}

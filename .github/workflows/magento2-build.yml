# Central Magento 2 build — reusable workflow (workstream #66, trede 1).
#
# A project repo calls this with ~6 lines (see platform/build/README.md);
# everything else is derived, never declared:
#   - The RELEASE LINE comes from composer.json (D2): the platform package
#     requirement (mage-os/ or magento/product-community-edition) maps to a
#     recipe under platform/build/<line>/ in THIS repo. Unknown line or a
#     line without a recipe fails loudly, naming what IS supported.
#     Magento Open Source 2.4.6-2.4.9 share recipes/magento; Mage-OS 3 has
#     recipes/mageos-3.
#   - The DOCKERFILE is the platform recipe for that line — unless the repo
#     ships its own Dockerfile (escape hatch: repo file wins wholesale).
#     .platform/* support files are overlaid PER FILE (a repo-local copy of
#     one file keeps the platform versions of the others).
#     Recipes live in THIS public repo (recipes/<line>/): no token, no
#     workflow-access setting — callable from any org, third-party ready.
#   - LOCALES for the DB-less static-content:deploy come from the repository
#     Actions variable DEPLOYYY_MAGENTO_LOCALES (set by the deployyy operator
#     from the app configuration). Default en_US. A deployyy.json
#     .build.locales list is a transitional fallback only.
#   - The APPLICATION DIRECTORY comes from the repository Actions variable
#     DEPLOYYY_ROOT_DIR (set by the deployyy operator from the project's root
#     directory), e.g. `src`. composer.json, the Dockerfile, .platform/,
#     deployyy.json, auth.json and patches/ are read there, and it is the
#     docker build context. Unset: the repository root.
#   - Images push to ghcr.io/<caller repo> as php-fpm-<sha7> + nginx-<sha7>
#     — the exact commit-keyed tags the operator verifies before deploying.
#     Both are pushed by digest first, scanned (trivy: a fixable CRITICAL
#     fails the build when the caller sets DEPLOYYY_SCAN_ENFORCE=1), and tagged only when both passed; each carries an
#     SBOM and provenance attestation (.github/actions/build-scan).
#   - PHP: the project's choice when it made one, else the line's default
#     (2.4.6 -> 8.2, 2.4.7 -> 8.3, 2.4.8/2.4.9 and Mage-OS 3 -> 8.4). The
#     choice comes from the repository Actions variable DEPLOYYY_PHP, which
#     the deployyy operator sets from the project configuration:
#     {"default":"8.3","branches":{"staging":"8.4"}} — the branch's own
#     entry first, then the project's. A version the line does not support
#     fails the build, naming the ones it does. A CHOSEN version is part of
#     the image's identity: the tags become php-fpm-<php>-<sha7> +
#     nginx-<php>-<sha7>, the only tags the operator accepts for a project
#     that chose that version (so a build of another PHP never stands in).
#     No choice: the tags stay php-fpm-<sha7> + nginx-<sha7>.
#
#   - SEVERAL APPLICATIONS in one repository, each in its own folder and each
#     a project of its own: the operator sets DEPLOYYY_APPS (an entry per
#     folder with its image and settings) in place of the single variables
#     above, and this workflow builds the entries of its kind, one job each,
#     re-using the release of an application whose folder the push did not
#     change (actions/applications, README "Several applications in one
#     repository"). Without DEPLOYYY_APPS it is one job, `build`, as always.
#
# Variables and secrets: ALL of the project's, never named. The caller passes
# them in one go, identical for every project (README "Variables and
# secrets"):
#
#   with:
#     vars: ${{ toJSON(vars) }}
#   secrets:
#     all: ${{ toJSON(secrets) }}
#
# That works within and across organizations: `all` is one declared secret,
# passed by name. (`secrets: inherit` only reaches a reusable workflow in the
# caller's own organization or enterprise — a project in graphcommerce-org
# calling this ho-nl workflow got NO secrets that way, deployyy-operator#276.
# An inherit caller inside ho-nl still works: the job's own secrets context is
# merged in too.) project-values masks every secret, drops github_token, and
# makes every key an environment variable of the build steps and the BuildKit
# secret `build-env`. COMPOSER_AUTH (the content of auth.json; legacy name
# MAGENTO_AUTH_JSON) simply arrives as one of the keys and becomes auth.json;
# none is needed for public packages (Mage-OS).
#
# Per environment: when the repository has a GitHub Environment named after the
# branch (`main`, `staging`, ...), the build job runs in it, so its variables
# and secrets override the repository's (the `environment` job looks it up; a
# branch without one builds with the repository's values, and no Environment is
# created). The Environment belongs to the caller's repository, so this works
# for a caller in any organization. Its protection rules apply to the build.
#
# After a successful build the same set goes to Deployyy for this branch's
# environment (deliver-values), authenticated with the job's Actions OIDC token
# — no stored credential. The console lists their names only, and the
# running app reads them with getenv(). Deployyy unreachable or not taking them
# is a warning, never a failed build; the environment then keeps the values it
# had. A redeploy or rollback without a build keeps the last delivered values.
#
# The caller grants what the jobs need (see README):
#   permissions: { contents: read, packages: write, actions: read, id-token: write }
# The jobs declare no permissions of their own and take the caller's: a job
# asking for more than its caller grants never starts (startup_failure, no
# log), while a missing grant at run time is a warning that names it. A caller
# from before 2026-10-07 (`secrets: inherit`, or COMPOSER_AUTH by name, no
# permissions) therefore still builds, and project-values says what to change.

name: magento2-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubicloud-standard-16
        description: Runner label
      vars:
        type: string
        default: "{}"
        description: "All caller variables, as toJSON(vars)"
    secrets:
      all:
        required: false
        description: "All caller secrets, as toJSON(secrets)"
      # The previous hand-off named these two. Still declared so such a caller
      # starts (an undeclared name is a startup_failure); project-values merges
      # them in and warns that the caller should pass `all` instead.
      COMPOSER_AUTH:
        required: false
        description: "Deprecated: pass all instead"
      MAGENTO_AUTH_JSON:
        required: false
        description: "Deprecated: pass all instead"

jobs:
  # Which GitHub Environment the build runs in: the one named after the branch,
  # when the repository has it. Looked up rather than assumed, because a job
  # that names an Environment that does not exist creates it — one per preview
  # branch, for nothing.
  environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.find.outputs.name }}
      # Which of the repository's applications this run builds and which it
      # re-uses (actions/applications): one `build` for a repository with one
      # application, as always.
      build: ${{ steps.apps.outputs.build }}
      reuse: ${{ steps.apps.outputs.reuse }}
    steps:
      - name: Find the branch's GitHub Environment
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "\"$BRANCH\" is a tag. The repository's variables and secrets apply."; exit 0
          fi
          enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$BRANCH")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPO/environments/$enc" || echo 000)
          case "$code" in
            200) echo "GitHub Environment \"$BRANCH\" found. Its variables and secrets override the repository's."
                 echo "name=$BRANCH" >> "$GITHUB_OUTPUT" ;;
            404) echo "No GitHub Environment \"$BRANCH\". The repository's variables and secrets apply." ;;
            403) echo "::warning title=Missing permission actions: read::The caller workflow does not grant \`actions: read\`. Values from GitHub Environment \"$BRANCH\" are not used. Add \`actions: read\` to the caller's \`permissions\`, see README Step 3." ;;
            *)   echo "::warning::GitHub Environment lookup for \"$BRANCH\" failed with HTTP $code. The repository's variables and secrets apply. Re-run the build to use the Environment's values." ;;
          esac

      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      # A repository may hold several applications, each a project of its own
      # (DEPLOYYY_APPS, set by the deployyy operator): one build job per
      # magento2 application, and none for one whose folder this push did
      # not change (its release is re-used, the reuse job below).
      - name: Plan applications
        id: apps
        uses: ./.platform-recipes/.github/actions/applications
        with:
          vars: ${{ inputs.vars }}
          application: magento2

  build:
    needs: environment
    if: needs.environment.outputs.build != '[]'
    # `build` for a repository with one application, so its check keeps its
    # name; `build (<folder>)` per application otherwise.
    name: ${{ matrix.app.label }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.build) }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch platform build recipes
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: |
            recipes
            .github/actions

      - name: Load variables and secrets
        id: values
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}

      # This job's application: for a repository with several, its folder,
      # image and settings stand in for the repository's single variables.
      - name: Set up application
        id: app
        uses: ./.platform-recipes/.github/actions/application
        with:
          app: ${{ toJSON(matrix.app) }}

      - name: Check application directory
        id: root
        # DEPLOYYY_ROOT_DIR (set by the deployyy operator from the project's
        # root directory) is in the environment with the project's variables.
        # Unset or empty: the repository root, as before it existed.
        run: |
          dir="${DEPLOYYY_ROOT_DIR:-}"
          if [ -z "$dir" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail() { echo "::error title=DEPLOYYY_ROOT_DIR::$1"; exit 1; }
          [[ "$dir" =~ ^[A-Za-z0-9_.@+/-]+$ ]] ||
            fail "DEPLOYYY_ROOT_DIR contains characters other than letters, digits and / _ . @ + -. Set the project's root directory to a path inside the repository, such as src."
          case "$dir" in
            /*) fail "DEPLOYYY_ROOT_DIR=$dir starts with /. Set the project's root directory to a path inside the repository, such as src." ;;
            */ | *//*) fail "DEPLOYYY_ROOT_DIR=$dir has an empty segment. Set the project's root directory to a path inside the repository, such as src." ;;
          esac
          IFS=/ read -ra parts <<< "$dir"
          path=""
          for part in "${parts[@]}"; do
            case "$part" in
              . | ..) fail "DEPLOYYY_ROOT_DIR=$dir has a . or .. segment. Set the project's root directory to a path inside the repository, such as src." ;;
            esac
            path="${path:+$path/}$part"
            [ -L "$path" ] && fail "DEPLOYYY_ROOT_DIR=$dir: $path is a symbolic link. Set the project's root directory to the real directory."
            [ -d "$path" ] || fail "DEPLOYYY_ROOT_DIR=$dir: directory $path does not exist in commit ${GITHUB_SHA::7}. Push the directory or change the project's root directory."
          done
          echo "Application directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Resolve release line, locales and build context
        id: resolve
        # DEPLOYYY_MAGENTO_LOCALES and DEPLOYYY_PHP
        # (the platform's settings, written by the operator) are in the
        # environment already, with the rest of the project's variables.
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          BRANCH: ${{ github.ref_name }}
          RECIPES: ${{ github.workspace }}/.platform-recipes/recipes
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib, shutil, sys

          # D2: the line is DERIVED from composer.json, never declared.
          # (deployyy.json's receiver-era `base` field is ignored on purpose.)
          req = json.load(open("composer.json")).get("require", {})
          LINES = [  # (package, version-prefix, line id, recipe dir, PHP versions)
              # PHP versions: the line's default first (the highest PHP the
              # release supports on the platform's base images), then what a
              # project may choose instead. The deployyy catalog
              # (Magento2Release spec.php / spec.phpVersions) and the
              # operator's hosted build (internal/build magentoLines) carry
              # the same table; keep the three in step.
              #
              # Mage OS 3.x are security releases of one line (same 2.4.9
              # core, same service versions — 3.1/3.2/3.3/3.4 verified),
              # so the match is MAJOR-level. A core change comes as a new
              # major, which simply has no recipe until validated.
              #
              # PHP 8.5 on 2.4.9 / Mage-OS 3 (Adobe's tested version for the
              # line; Paul, 2026-10-08): accepted as a choice ahead of the
              # catalog, so its live trial can run; the catalog does not
              # offer it yet. TODO(php-8.5): after the trial, make 8.5 the
              # default here, in the operator and in the catalog together,
              # and drop 8.3. Every project that chose no version follows the
              # default (deployyy-operator docs/PHP-VERSIONS.md "PHP 8.5").
              ("mage-os/product-community-edition", "3.", "mageos-3", "mageos-3", ["8.4", "8.5", "8.3"]),
              # Magento Open Source: one recipe, PHP per line.
              ("magento/product-community-edition", "2.4.9", "magento-249", "magento", ["8.4", "8.5", "8.3"]),
              ("magento/product-community-edition", "2.4.8", "magento-248", "magento", ["8.4", "8.3"]),
              ("magento/product-community-edition", "2.4.7", "magento-247", "magento", ["8.3", "8.2"]),
              ("magento/product-community-edition", "2.4.6", "magento-246", "magento", ["8.2", "8.1"]),
          ]
          match = next(((l, r, phps) for p, v, l, r, phps in LINES
                        if p in req and req[p].lstrip("~^>=v ").startswith(v)), None)
          if not match:
              plats = {p: v for p, v in req.items() if "product-" in p and "-edition" in p}
              if any("enterprise-edition" in p for p in plats):
                  sys.exit("FATAL: Adobe Commerce, magento/product-enterprise-edition, has no recipe. "
                           "Add a Dockerfile to the application directory.")
              found = ", ".join(f"{p} {v}" for p, v in plats.items()) or "none"
              sys.exit(f"FATAL: composer.json requires no supported release line. Found: {found}. "
                       f"Supported: {', '.join(l for _,_,l,_,_ in LINES)}.")
          line, recipe_id, phps = match
          php = phps[0]

          # The project's PHP choice (set by the deployyy operator): this
          # branch's entry, else the project's. Malformed JSON is a platform
          # bug, not the project's — fail loudly rather than build a PHP
          # nobody chose.
          chosen = ""
          raw = os.environ.get("DEPLOYYY_PHP", "").strip()
          if raw:
              try:
                  choice = json.loads(raw)
              except ValueError:
                  sys.exit(f"FATAL: the repository variable DEPLOYYY_PHP is not valid JSON: {raw!r}. Choose the PHP version again in the console.")
              chosen = (choice.get("branches") or {}).get(os.environ["BRANCH"]) or choice.get("default") or ""
          if chosen:
              if chosen not in phps:
                  sys.exit(f"FATAL: {line} does not support PHP {chosen}. Choose PHP {' or '.join(phps)} in the console.")
              php = chosen

          # Escape hatch FIRST: a repo-local Dockerfile wins wholesale, and a
          # line without a platform recipe is fine as long as the repo builds
          # itself (the demo ladder ships a Dockerfile per version branch).
          recipe = pathlib.Path(os.environ["RECIPES"]) / recipe_id
          local_dockerfile = pathlib.Path("Dockerfile").exists()
          if not recipe.is_dir():
              if not local_dockerfile:
                  have = sorted(p.name for p in pathlib.Path(os.environ["RECIPES"]).iterdir() if p.is_dir())
                  sys.exit(f"FATAL: recipes/{recipe_id} for {line} does not exist. Recipes: {', '.join(have)}. "
                           f"Add a Dockerfile to the application directory.")
              print(f"{line} has no recipe. Dockerfile: the repository's own.")
          else:
              if local_dockerfile:
                  print("Dockerfile: the repository's own. The recipe Dockerfile is not used.")
              else:
                  shutil.copy(recipe / "Dockerfile", "Dockerfile")
                  print(f"Dockerfile: recipes/{recipe_id}")

              # Support files: per-file overlay (repo-local file wins). A repo
              # that builds with its own Dockerfile on the Magento Open Source
              # recipe gets none: before that recipe existed those repos (the
              # demo ladder) built exactly as committed, and a new file in
              # .platform/ would change their image without anyone asking.
              if local_dockerfile and recipe_id == "magento":
                  print("The repository has its own Dockerfile. Support files from recipes/magento are not copied.")
              else:
                  pathlib.Path(".platform").mkdir(exist_ok=True)
                  for f in sorted((recipe / "platform").iterdir()):
                      dest = pathlib.Path(".platform") / f.name
                      if dest.exists():
                          print(f".platform/{f.name}: the repository's own")
                      else:
                          shutil.copy(f, dest)
                          print(f".platform/{f.name}: from the recipe")
          # PHP comes from the line only when the platform Dockerfile builds: a
          # repo-local Dockerfile keeps its own PHP_VERSION default — unless
          # the project CHOSE a version, which the tags will name, so the
          # build must at least be asked for it.
          if local_dockerfile and not chosen:
              php = ""

          # Locales for the DB-less static-content:deploy. The platform is
          # the source of truth: the operator mirrors the app's configured
          # locales into the repository Actions variable
          # DEPLOYYY_MAGENTO_LOCALES. A deployyy.json `.build.locales` list
          # is a transitional fallback only; the default is en_US.
          locales = os.environ.get("DEPLOYYY_MAGENTO_LOCALES", "").strip()
          if not locales:
              try:
                  locs = json.load(open("deployyy.json")).get("build", {}).get("locales", [])
                  if locs:
                      locales = " ".join(locs)
              except FileNotFoundError:
                  pass
          locales = locales or "en_US"
          print(f"line={line} recipe={recipe_id} php={php} chosen={chosen or '-'} locales={locales}")
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          print(f"line={line}", file=out)
          # A whole build-arg line, empty when the repo builds its own Dockerfile
          # (an empty line is skipped; `PHP_VERSION=` would blank its default).
          print(f"php_arg={'PHP_VERSION=' + php if php else ''}", file=out)
          print(f"locales={locales}", file=out)
          # The release tag: php-fpm-<tag> / nginx-<tag>. A chosen PHP is in
          # it, BEFORE the sha (the operator reads the sha off the end).
          sha7 = os.environ['GITHUB_SHA'][:7]
          print(f"sha_tag={chosen + '-' + sha7 if chosen else sha7}", file=out)
          print(f"os_updates_day={datetime.date.today().isoformat()}", file=out)
          EOF

      - name: Write auth.json
        # COMPOSER_AUTH (or the legacy MAGENTO_AUTH_JSON) is one of the
        # project's secrets, exported by project-values like every other key.
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -n "${COMPOSER_AUTH:-}" ]; then printf '%s' "$COMPOSER_AUTH" > auth.json
          elif [ -n "${MAGENTO_AUTH_JSON:-}" ]; then printf '%s' "$MAGENTO_AUTH_JSON" > auth.json
          else
            # No credentials configured. That is a VALID state, not a fatal one:
            # a Mage-OS project resolves everything from public repositories
            # (repo.mage-os.org + packagist) and needs no auth at all. Projects
            # that DO pull Adobe Commerce / Magento Open Source / paid packages
            # fail later at `composer install` with composer's own message
            # naming the package that needs credentials — a better error than
            # refusing to try. An empty auth.json keeps composer's auth
            # plumbing happy without granting anything.
            echo "No COMPOSER_AUTH secret. Composer installs public packages only. Add COMPOSER_AUTH for Marketplace or private packages."
            echo '{}' > auth.json
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + scan php-fpm
        id: php
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: php-fpm
          label: php-fpm
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          secret-files: build-env=${{ steps.values.outputs.build-env }}
          build-args: |
            ${{ steps.resolve.outputs.php_arg }}
            PLATFORM_LOCALES=${{ steps.resolve.outputs.locales }}
          # Do not let the later nginx export replace the PHP runtime layers.
          # Import the legacy scope once for existing projects during migration.
          cache-from: |
            type=gha,scope=php-fpm${{ steps.app.outputs.scope }}
            type=gha
          cache-to: type=gha,scope=php-fpm${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      - name: Build + scan nginx
        id: nginx
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: nginx
          label: nginx
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          secret-files: build-env=${{ steps.values.outputs.build-env }}
          build-args: |
            ${{ steps.resolve.outputs.php_arg }}
            PLATFORM_LOCALES=${{ steps.resolve.outputs.locales }}
            PLATFORM_OS_UPDATES_DAY=${{ steps.resolve.outputs.os_updates_day }}
          cache-from: |
            type=gha,scope=nginx${{ steps.app.outputs.scope }}
            type=gha,scope=php-fpm${{ steps.app.outputs.scope }}
            type=gha
          cache-to: type=gha,scope=nginx${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      # The operator deploys a commit once BOTH tags exist, so tags are set
      # only after both images passed their scan.
      - name: Tag the release
        env:
          IMAGE: ${{ steps.app.outputs.image }}
          SHA_TAG: ${{ steps.resolve.outputs.sha_tag }}
          PHP_REF: ${{ steps.php.outputs.ref }}
          NGINX_REF: ${{ steps.nginx.outputs.ref }}
        run: |
          image="${IMAGE,,}"
          docker buildx imagetools create -t "$image:nginx-$SHA_TAG" "$NGINX_REF"
          docker buildx imagetools create -t "$image:php-fpm-$SHA_TAG" "$PHP_REF"
          echo "Released $image:php-fpm-$SHA_TAG and $image:nginx-$SHA_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      # The same variables and secrets, for the running shop: Deployyy writes
      # them into this branch's environment. Never fails the build.
      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.values.outputs.values }}
          platform: magento2
          several: ${{ steps.app.outputs.multi }}
          root-directory: ${{ steps.app.outputs.directory }}

  # An application whose folder this push did not change: its new commit's
  # tags point at the release of the push before, which is the image a build
  # would make again (the folder is the whole build context). Only for a
  # repository with several applications (actions/applications says when).
  reuse:
    needs: environment
    if: needs.environment.outputs.reuse != '[]'
    name: ${{ matrix.app.label }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.reuse) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      - name: Load variables and secrets
        id: values
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}
          export: "false"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the previous push's release
        env:
          IMAGE: ${{ matrix.app.image }}
          PAIRS: ${{ toJSON(matrix.app.pairs) }}
          FROM: ${{ matrix.app.from }}
          DIRECTORY: ${{ matrix.app.directory }}
        run: |
          image="${IMAGE,,}"
          python3 -c 'import json, os; [print(a, b) for a, b in json.loads(os.environ["PAIRS"])]' |
          while read -r old new; do
            docker buildx imagetools create -t "$image:$new" "$image:$old"
          done
          echo "$DIRECTORY is unchanged since $FROM. Released $image with the $FROM release." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.values.outputs.values }}
          platform: magento2
          several: "true"
          root-directory: ${{ matrix.app.directory }}

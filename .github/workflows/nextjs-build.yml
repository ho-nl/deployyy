# Central Next.js / GraphCommerce build — reusable workflow.
#
# A project repo calls this with a few lines (see README); everything else is
# derived:
#   - NODE from .nvmrc / .node-version, else package.json `engines.node`
#     (the highest of 24, 22, 20 the range allows), else 22.
#   - The DOCKERFILE is recipes/nextjs — unless the repo ships its own (a
#     repo-local Dockerfile wins wholesale). .platform/* support files are
#     overlaid per file (a repo-local copy of one file keeps the others).
#   - The ISR CACHE HANDLER is wired in at build time: the recipe wraps the
#     project's next.config with `cacheHandler` (graphcommerce/
#     cache-handler.mjs) and `cacheMaxMemorySize: 0`. Projects carry no cache
#     code and no cache config.
#   - The APPLICATION DIRECTORY comes from the repository Actions variable
#     DEPLOYYY_ROOT_DIR (set by the deployyy operator), e.g. `apps/web`:
#     package.json, .nvmrc / .node-version, the Dockerfile and .platform/ are
#     read there, and it is the docker build context. Unset: the repository
#     root.
#   - BUILD ENV: every variable and secret of the project reaches `next
#     build` as the BuildKit secret `build-env` (never a build-arg, never in a
#     layer or in the provenance), the way a Vercel build sees all of them.
#
# Images (ghcr.io/<caller repo>), tagged only after both passed the scan:
#   - sha-<sha7>-cache-seed  the prerendered routes in the cache handler's
#                            format; the operator's seed Job loads it into
#                            the shared cache volume. Tagged FIRST, so it
#                            exists when the operator sees the app tag.
#   - sha-<sha7>             the Next.js standalone server, the tag the
#                            operator probes (repository_controller.go
#                            tagPrefixes: GraphCommerceApp {"sha-", ""}).
#
#   - SEVERAL APPLICATIONS in one repository, each in its own folder and each
#     a project of its own: the operator sets DEPLOYYY_APPS (an entry per
#     folder with its image and settings) in place of the single variables
#     above, and this workflow builds the entries of its kind, one job each,
#     re-using the release of an application whose folder the push did not
#     change (actions/applications, README "Several applications in one
#     repository"). Without DEPLOYYY_APPS it is one job, `build`, as always.
#
# Variables and secrets: ALL of the project's, never named — the same hand-off
# and the same handling as magento2-build.yml (see its header):
#
#   with:
#     vars: ${{ toJSON(vars) }}
#   secrets:
#     all: ${{ toJSON(secrets) }}
#
# This works for a caller in any organization (`secrets: inherit` does not, and
# from ho-nl it still does). A GitHub Environment named after the branch
# overrides the repository's values. After a successful build the set goes to
# Deployyy for this branch's environment (deliver-values, OIDC, never fails
# the build), where the running server reads it from process.env.
#
# Permissions: the jobs declare none and take the caller's grants, as
# magento2-build.yml explains, so a caller from before 2026-10-07 still builds
# and is told what to change.

name: nextjs-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubicloud-standard-8
        description: Runner label
      vars:
        type: string
        default: "{}"
        description: "All caller variables, as toJSON(vars)"
      platform:
        type: string
        default: nextjs
        description: Project type when one repository holds several projects, nextjs or graphcommerce
    secrets:
      all:
        required: false
        description: "All caller secrets, as toJSON(secrets)"

jobs:
  # Which GitHub Environment the build runs in: the one named after the branch,
  # when the repository has it. Looked up rather than assumed, because a job
  # that names an Environment that does not exist creates it — one per preview
  # branch, for nothing.
  environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.find.outputs.name }}
      # Which of the repository's applications this run builds and which it
      # re-uses (actions/applications): one `build` for a repository with one
      # application, as always.
      build: ${{ steps.apps.outputs.build }}
      reuse: ${{ steps.apps.outputs.reuse }}
    steps:
      - name: Find the branch's GitHub Environment
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "\"$BRANCH\" is a tag. The repository's variables and secrets apply."; exit 0
          fi
          enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$BRANCH")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPO/environments/$enc" || echo 000)
          case "$code" in
            200) echo "GitHub Environment \"$BRANCH\" found. Its variables and secrets override the repository's."
                 echo "name=$BRANCH" >> "$GITHUB_OUTPUT" ;;
            404) echo "No GitHub Environment \"$BRANCH\". The repository's variables and secrets apply." ;;
            403) echo "::warning title=Missing permission actions: read::The caller workflow does not grant \`actions: read\`. Values from GitHub Environment \"$BRANCH\" are not used. Add \`actions: read\` to the caller's \`permissions\`, see README Step 3." ;;
            *)   echo "::warning::GitHub Environment lookup for \"$BRANCH\" failed with HTTP $code. The repository's variables and secrets apply. Re-run the build to use the Environment's values." ;;
          esac

      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      # A repository may hold several applications, each a project of its own
      # (DEPLOYYY_APPS, set by the deployyy operator): one build job per
      # graphcommerce application, and none for one whose folder this push did
      # not change (its release is re-used, the reuse job below).
      - name: Plan applications
        id: apps
        uses: ./.platform-recipes/.github/actions/applications
        with:
          vars: ${{ inputs.vars }}
          application: graphcommerce

  build:
    needs: environment
    if: needs.environment.outputs.build != '[]'
    # `build` for a repository with one application, so its check keeps its
    # name; `build (<folder>)` per application otherwise.
    name: ${{ matrix.app.label }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.build) }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch platform build recipes
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: |
            recipes
            graphcommerce
            .github/actions

      # First: DEPLOYYY_ROOT_DIR, one of the project's variables, says where
      # the files the next steps read are.
      - name: Load variables and secrets
        id: env
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}

      # This job's application: for a repository with several, its folder,
      # image and settings stand in for the repository's single variables.
      - name: Set up application
        id: app
        uses: ./.platform-recipes/.github/actions/application
        with:
          app: ${{ toJSON(matrix.app) }}

      # A GraphCommerce storefront is built against its paired Magento
      # backend: the build introspects that backend's GraphQL schema and bakes
      # its endpoint into the bundle. The deployyy operator publishes every
      # branch's backend as the repository variable
      # DEPLOYYY_GC_MAGENTO_ENDPOINTS (JSON: branch -> GraphQL endpoint, "*"
      # for a branch without an environment). This branch's entry becomes
      # GC_MAGENTO_ENDPOINT for the build, in place of the project's own value
      # and graphcommerce.config.js, and the build first waits until it
      # answers, which also wakes a sleeping preview. Unset: nothing changes.
      - name: Wait for the paired Magento backend
        if: env.DEPLOYYY_GC_MAGENTO_ENDPOINTS != ''
        env:
          BUILD_ENV_FILE: ${{ steps.env.outputs.build-env }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re, shlex, sys, time, urllib.error, urllib.request

          try:
              pairs = json.loads(os.environ["DEPLOYYY_GC_MAGENTO_ENDPOINTS"])
          except ValueError:
              print("::warning::DEPLOYYY_GC_MAGENTO_ENDPOINTS is not valid JSON. The Magento endpoint configured in the repository is used. Do not edit DEPLOYYY_GC_MAGENTO_ENDPOINTS by hand.")
              sys.exit(0)
          branch = os.environ["BRANCH"]
          endpoint = (pairs.get(branch) or pairs.get("*")) if isinstance(pairs, dict) else None
          if not endpoint:
              print(f"No paired Magento backend for {branch}. The Magento endpoint configured in the repository is used.")
              sys.exit(0)
          if not re.fullmatch(r"https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?", endpoint):
              raise SystemExit(f"::error title=Magento backend::DEPLOYYY_GC_MAGENTO_ENDPOINTS sets {endpoint!r} for {branch}, which is not an http or https URL. Do not edit DEPLOYYY_GC_MAGENTO_ENDPOINTS by hand.")
          print(f"GC_MAGENTO_ENDPOINT={endpoint}")

          # The build env file is sourced line by line: a later assignment wins.
          with open(os.environ["BUILD_ENV_FILE"], "a") as out:
              out.write(f"GC_MAGENTO_ENDPOINT={shlex.quote(endpoint)}\n")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"GC_MAGENTO_ENDPOINT={endpoint}\n")

          # Wait for it to answer GraphQL: a sleeping preview answers with a
          # wake page first, and the request is what wakes it.
          deadline = time.time() + 600
          last = ""
          while True:
              req = urllib.request.Request(endpoint, data=b'{"query":"{__typename}"}', method="POST",
                  headers={"Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      last = f"HTTP {resp.status} without GraphQL data"
                      try:
                          body = json.loads(resp.read(1 << 20) or b"{}")
                      except ValueError:
                          body = None
                      if isinstance(body, dict) and body.get("data"):
                          print(f"{endpoint} returned a GraphQL response")
                          break
              except urllib.error.HTTPError as e:
                  last = f"HTTP {e.code}"
              except (urllib.error.URLError, OSError) as e:
                  last = str(getattr(e, "reason", e))
              if time.time() > deadline:
                  raise SystemExit(f"::error title=Magento backend::{endpoint} returned no GraphQL response within 10 minutes. Last result: {last}. Start the Magento environment, then re-run the build.")
              print(f"Waiting for {endpoint}: {last}. Retrying in 10s.")
              time.sleep(10)
          EOF

      - name: Check application directory
        id: root
        # DEPLOYYY_ROOT_DIR (set by the deployyy operator from the project's
        # root directory) is in the environment with the project's variables.
        # Unset or empty: the repository root, as before it existed.
        run: |
          dir="${DEPLOYYY_ROOT_DIR:-}"
          if [ -z "$dir" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail() { echo "::error title=DEPLOYYY_ROOT_DIR::$1"; exit 1; }
          [[ "$dir" =~ ^[A-Za-z0-9_.@+/-]+$ ]] ||
            fail "DEPLOYYY_ROOT_DIR contains characters other than letters, digits and / _ . @ + -. Set the project's root directory to a path inside the repository, such as src."
          case "$dir" in
            /*) fail "DEPLOYYY_ROOT_DIR=$dir starts with /. Set the project's root directory to a path inside the repository, such as src." ;;
            */ | *//*) fail "DEPLOYYY_ROOT_DIR=$dir has an empty segment. Set the project's root directory to a path inside the repository, such as src." ;;
          esac
          IFS=/ read -ra parts <<< "$dir"
          path=""
          for part in "${parts[@]}"; do
            case "$part" in
              . | ..) fail "DEPLOYYY_ROOT_DIR=$dir has a . or .. segment. Set the project's root directory to a path inside the repository, such as src." ;;
            esac
            path="${path:+$path/}$part"
            [ -L "$path" ] && fail "DEPLOYYY_ROOT_DIR=$dir: $path is a symbolic link. Set the project's root directory to the real directory."
            [ -d "$path" ] || fail "DEPLOYYY_ROOT_DIR=$dir: directory $path does not exist in commit ${GITHUB_SHA::7}. Push the directory or change the project's root directory."
          done
          echo "Application directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Resolve Node and build context
        id: resolve
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          RECIPES: ${{ github.workspace }}/.platform-recipes/recipes
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re, shutil

          pkg = json.load(open("package.json"))
          deps = {**pkg.get("dependencies", {}), **pkg.get("devDependencies", {})}
          if "next" not in deps:
              raise SystemExit("FATAL: package.json has no next dependency. nextjs-build.yml builds Next.js applications only.")
          graphcommerce = any(d.startswith("@graphcommerce/") for d in deps)
          print(f"next {deps['next']}, GraphCommerce: {'yes' if graphcommerce else 'no'}")

          supported = ["24", "22", "20"]
          node, source = None, None
          for f in (".nvmrc", ".node-version"):
              p = pathlib.Path(f)
              if p.exists():
                  m = re.match(r"\s*v?(\d+)", p.read_text())
                  if m and m.group(1) in supported:
                      node, source = m.group(1), f
                  elif m:
                      print(f"::warning::{f} sets Node {m.group(1)}, which is not supported. Set Node {', '.join(supported)} in {f}.")
                  break
          def allows(rng, major):
              # A semver range on the MAJOR only: `||` alternatives of
              # space-separated comparators (>=, >, <=, <, =, ^, ~, x-ranges).
              for alt in rng.split("||"):
                  ok = True
                  for c in re.findall(r"(>=|<=|>|<|=|\\^|~)?\s*v?(\d+)(?:\.[\dxX*]+)*", alt):
                      op, n = c[0], int(c[1])
                      ok &= {">=": major >= n, ">": major > n, "<=": major <= n,
                             "<": major < n}.get(op, major == n)
                  if ok and alt.strip():
                      return True
              return False
          if node is None:
              engines = pkg.get("engines", {}).get("node", "")
              if engines.strip():
                  node = next((v for v in supported if allows(engines, int(v))), None)
                  if node:
                      source = f"engines.node {engines!r}"
                  else:
                      print(f"::warning::engines.node {engines!r} allows none of Node {', '.join(supported)}. Building with Node 22.")
          node = node or "22"
          print(f"Node {node}, from {source or 'the default'}")

          recipe = pathlib.Path(os.environ["RECIPES"]) / "nextjs"
          if pathlib.Path("Dockerfile").exists():
              print("Dockerfile: the repository's own. The recipe Dockerfile is not used.")
          else:
              shutil.copy(recipe / "Dockerfile", "Dockerfile")
              print("Dockerfile: recipes/nextjs")
          platform = pathlib.Path(".platform")
          platform.mkdir(exist_ok=True)
          # The cache handler and seed live in recipes/nextjs/platform. The copies
          # under graphcommerce/ stay frozen: live GraphCommerce projects fetch
          # them from main in their own CI, so changing them would change a
          # production build that never opted in.
          support = sorted((recipe / "platform").iterdir())
          for f in support:
              dest = platform / f.name
              if dest.exists():
                  print(f".platform/{f.name}: the repository's own")
              else:
                  shutil.copy(f, dest)
                  print(f".platform/{f.name}: from the recipe")

          sha7 = os.environ["GITHUB_SHA"][:7]
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          print(f"node={node}", file=out)
          print(f"tag=sha-{sha7}", file=out)
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + scan cache seed
        id: seed
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: cache-seed
          label: cache-seed
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          build-args: |
            NODE_VERSION=${{ steps.resolve.outputs.node }}
            DEPLOYYY_BUILD_ID=${{ github.sha }}
          secret-files: build-env=${{ steps.env.outputs.build-env }}
          cache-from: type=gha,scope=nextjs${{ steps.app.outputs.scope }}
          cache-to: type=gha,scope=nextjs${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      - name: Build + scan runtime
        id: runtime
        uses: ./.platform-recipes/.github/actions/build-scan
        with:
          image: ${{ steps.app.outputs.image }}
          context: ${{ steps.root.outputs.dir }}
          target: runtime
          label: runtime
          enforce: ${{ env.DEPLOYYY_SCAN_ENFORCE == '1' }}
          build-args: |
            NODE_VERSION=${{ steps.resolve.outputs.node }}
            DEPLOYYY_BUILD_ID=${{ github.sha }}
          secret-files: build-env=${{ steps.env.outputs.build-env }}
          cache-from: type=gha,scope=nextjs${{ steps.app.outputs.scope }}
          cache-to: type=gha,scope=nextjs${{ steps.app.outputs.scope }},mode=max,ignore-error=true

      - name: Tag the release
        env:
          IMAGE: ${{ steps.app.outputs.image }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SEED: ${{ steps.seed.outputs.ref }}
          RUNTIME: ${{ steps.runtime.outputs.ref }}
        run: |
          image="${IMAGE,,}"
          docker buildx imagetools create -t "$image:$TAG-cache-seed" "$SEED"
          docker buildx imagetools create -t "$image:$TAG" "$RUNTIME"
          echo "Released $image:$TAG and $image:$TAG-cache-seed" | tee -a "$GITHUB_STEP_SUMMARY"

      # The same variables and secrets, for the running server: Deployyy
      # writes them into this branch's environment. Never fails the build.
      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.env.outputs.values }}
          platform: ${{ inputs.platform }}
          several: ${{ steps.app.outputs.multi }}
          root-directory: ${{ steps.app.outputs.directory }}

  # An application whose folder this push did not change: its new commit's
  # tags point at the release of the push before, which is the image a build
  # would make again (the folder is the whole build context). Only for a
  # repository with several applications (actions/applications says when).
  reuse:
    needs: environment
    if: needs.environment.outputs.reuse != '[]'
    name: ${{ matrix.app.label }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.environment.outputs.reuse) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - name: Fetch platform build actions
        uses: actions/checkout@v4
        with:
          repository: ho-nl/deployyy
          path: .platform-recipes
          sparse-checkout: .github/actions

      - name: Load variables and secrets
        id: values
        uses: ./.platform-recipes/.github/actions/project-values
        with:
          vars: ${{ inputs.vars }}
          secrets: ${{ secrets.all }}
          job-vars: ${{ toJSON(vars) }}
          job-secrets: ${{ toJSON(secrets) }}
          export: "false"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the previous push's release
        env:
          IMAGE: ${{ matrix.app.image }}
          PAIRS: ${{ toJSON(matrix.app.pairs) }}
          FROM: ${{ matrix.app.from }}
          DIRECTORY: ${{ matrix.app.directory }}
        run: |
          image="${IMAGE,,}"
          python3 -c 'import json, os; [print(a, b) for a, b in json.loads(os.environ["PAIRS"])]' |
          while read -r old new; do
            docker buildx imagetools create -t "$image:$new" "$image:$old"
          done
          echo "$DIRECTORY is unchanged since $FROM. Released $image with the $FROM release." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deliver variables and secrets to the environment
        uses: ./.platform-recipes/.github/actions/deliver-values
        with:
          values: ${{ steps.values.outputs.values }}
          platform: ${{ inputs.platform }}
          several: "true"
          root-directory: ${{ matrix.app.directory }}

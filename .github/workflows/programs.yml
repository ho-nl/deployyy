name: programs

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: programs.Dockerfile
          tags: ghcr.io/ho-nl/deployyy-programs:${{ github.sha }}
          push: true

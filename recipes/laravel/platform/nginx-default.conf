# Laravel's public/ front controller, served by the nginx twin of the php-fpm
# image; PHP runs in the php container of the same pod.
upstream fastcgi_backend { server 127.0.0.1:9000; }
map $http_x_forwarded_proto $fastcgi_https { https on; default ""; }

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100m;

    # Fingerprinted build output: cacheable everywhere, including the CDN.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        # Laravel's response headers can be large (cookies, CSP).
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_read_timeout 300s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

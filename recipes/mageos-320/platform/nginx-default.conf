upstream fastcgi_backend { server 127.0.0.1:9000; }
map $http_x_forwarded_proto $fastcgi_https { https on; default ""; }

server {
    listen 8080;
    server_name _;
    set $MAGE_ROOT /var/www/html;
    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    charset UTF-8;
    client_max_body_size 100m;

    location /health_check.php {
        access_log off;
        fastcgi_pass fastcgi_backend;
        fastcgi_param SCRIPT_FILENAME $MAGE_ROOT/pub/health_check.php;
        include fastcgi_params;
    }

    location /static/ {
        expires max;
        location ~ ^/static/version\d*/ { rewrite ^/static/version\d*/(.*)$ /static/$1 last; }
        location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|js|css|eot|ttf|otf|woff|woff2|html|json|webmanifest)$ {
            add_header Cache-Control "public"; expires +1y;
            if (!-f $request_filename) { rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last; }
        }
        if (!-f $request_filename) { rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last; }
    }

    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;
        location ~ ^/media/theme_customization/.*\.xml { deny all; }
        location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|js|css|eot|ttf|otf|woff|woff2)$ {
            add_header Cache-Control "public"; expires +1y; try_files $uri $uri/ /get.php$is_args$args;
        }
    }

    # Deny the sensitive media subtrees. `location /media/` above serves anything under
    # pub/media straight off disk via try_files, so WITHOUT these every uploaded customer
    # document, downloadable product file and import CSV is publicly readable by URL.
    # These are longer prefixes than /media/, so nginx selects them first.
    #
    # Ported verbatim from Magento's own pub/../nginx.conf.sample (verified against the
    # 2.4.7-p10 image) — customer, downloadable, import, custom_options.
    #
    # customer_address is the APSB26-73 addition: that advisory removes
    # customer_address from Magento's media_storage_configuration/allowed_resources
    # (module-customer/etc/config.xml), which only closes the get.php path, and Adobe
    # adds the matching deny to nginx.conf.sample. Our isolated vendor patch is
    # explicitly shipped "without the generated nginx.conf.sample diff", so the nginx
    # half of that fix must live here or the subtree stays served off disk.
    location /media/customer/ { deny all; }
    location /media/customer_address/ { deny all; }
    location /media/downloadable/ { deny all; }
    location /media/import/ { deny all; }
    location /media/custom_options/ { deny all; }

    location / { try_files $uri $uri/ /index.php$is_args$args; }

    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        fastcgi_pass fastcgi_backend;
        # Magento emits large response headers (multiple Set-Cookie, long
        # redirect Location). The first buffer must hold the whole header
        # block or nginx 502s with "upstream sent too big header".
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_param PHP_FLAG "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param PHP_VALUE "memory_limit=2048M \n max_execution_time=18000";
        fastcgi_read_timeout 600s;
        fastcgi_param SCRIPT_FILENAME $MAGE_ROOT/pub/$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param MAGE_RUN_TYPE store;
        include fastcgi_params;
    }

    location ~* \.(php)$ { deny all; }
}
